[build-system]
requires = ["setuptools >= 68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "everythingmoe-api"
version = "1.0.0"
description = "Unofficial Python API wrapper for everythingmoe.com"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.9"
authors = [
    {name = "EverythingMoe API Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx >= 0.27.0",
    "beautifulsoup4 >= 4.12.0",
    "lxml >= 5.0.0",
    "fastapi >= 0.115.0",
    "uvicorn[standard] >= 0.30.0",
    "pydantic >= 2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-cov >= 5.0",
    "pytest-asyncio >= 0.23.0",
]

[project.urls]
Homepage = "https://github.com/itznan/EverythingMoeAPI"
Repository = "https://github.com/itznan/EverythingMoeAPI"
Issues = "https://github.com/itznan/EverythingMoeAPI/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
